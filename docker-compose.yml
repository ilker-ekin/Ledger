services:
  kafka:
    image: confluentinc/cp-kafka:8.0.0
    ports:
      # Bind to loopback only — the broker has no auth, so it must not be
      # reachable from other machines on the network.
      - "127.0.0.1:9092:9092"
    environment:
      # KRaft identity — a single node acting as both broker and controller.
      # NODE_ID and CLUSTER_ID are written to storage on first start; never change them.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      CLUSTER_ID: FypeId09RZOGLbpc9phqVw

      # Listeners — 9092 for clients, 9093 for controller traffic.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single broker: internal offsets topic can't be replicated 3 times.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Topics are created explicitly, never by a typo'd produce.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:
